<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JACKETS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="fevicon.png" type="image/x-icon">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div id="main">
        <div id="nav">
            <h4>About</h4>
            <h4>News</h4>
            <h4>Cart</h4>
            <div id="bag">
                <i class="ri-shopping-bag-fill" id="bagicon"></i>
            </div>
        </div>
        <div id="heading">
            <h1 id="headingh1">
                Lightly padded, <br>quality jacket in <br> recycled polyster.
            </h1>
        </div>
        <div id="below">
            <div id="left">
                <h2>-Exclusive brands aspire for the label haute <br>
                couture, but the term is technically limited to <br>
            members of the chambre syndicate da la Haute</h2>
            </div>
            <div id="right">
                <div class="elem">
                    <a href="#">Add To Cart</a>
                    <i class="ri-arrow-right-up-long-line"></i>
                </div>
                <div class="elem">
                    <a href="#">Product Details</a>
                    <i class="ri-arrow-right-up-long-line"></i>
                </div>
                <div class="elem">
                    <a href="#">Shipping</a>
                    <i class="ri-arrow-right-up-long-line"></i>
                </div>
            </div>
        </div>
        <div id="last">
            <img src="./models.avif" alt="model image">
        </div>
    </div>

</html>
